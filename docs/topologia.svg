<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Topología lógica del laboratorio A3</title>
  <desc id="desc">R1 conectado al switch. Ubuntu Desktop con Zabbix conectado al switch. La LAN usa la red 10.21.39.128/29.</desc>
  <rect width="960" height="280" rx="18" fill="#eef4f9"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17354d">LAN 10.21.39.128/29</text>
  <path d="M270 141H345M615 141H690" stroke="#2c769a" stroke-width="5"/>
  <g fill="#fff" stroke="#9bbdd1" stroke-width="2">
    <rect x="35" y="87" width="235" height="114" rx="12"/>
    <rect x="345" y="87" width="270" height="114" rx="12"/>
    <rect x="690" y="87" width="235" height="114" rx="12"/>
  </g>
  <g text-anchor="middle" font-family="Arial, sans-serif" fill="#17354d">
    <text x="152" y="117" font-size="18" font-weight="700">R1</text>
    <text x="152" y="145" font-size="16">10.21.39.129/29</text>
    <text x="152" y="174" font-size="15">DHCP · SNMP RO</text>
    <text x="480" y="117" font-size="18" font-weight="700">Switch</text>
    <text x="480" y="145" font-size="16">10.21.39.130/29 · Vlan1</text>
    <text x="480" y="174" font-size="15">SNMP RO</text>
    <text x="807" y="117" font-size="18" font-weight="700">Ubuntu Desktop</text>
    <text x="807" y="145" font-size="16">10.21.39.131/29 · DHCP</text>
    <text x="807" y="174" font-size="15">Zabbix · gestor SNMP</text>
    <text x="480" y="250" font-size="15">R1 Fa0/0 ↔ Switch Gi0/0 · Zabbix consulta R1 y Switch por UDP 161</text>
  </g>
</svg>

