!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
no ip dhcp use vrf connected
ip dhcp excluded-address 10.21.39.129 10.21.39.130
ip dhcp excluded-address 10.21.39.132 10.21.39.134
!
ip dhcp pool LAN-ZABBIX
   network 10.21.39.128 255.255.255.248
   default-router 10.21.39.129
!
!
no ip domain lookup
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 ip address 10.21.39.129 255.255.255.248
 speed 100
 full-duplex
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
access-list 31 permit 10.21.39.131
snmp-server community <COMUNIDAD_SNMP_OCULTA> RO 31
!
!
control-plane
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end

